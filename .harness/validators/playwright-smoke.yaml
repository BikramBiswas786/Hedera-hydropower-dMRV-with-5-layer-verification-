name: hydro-dmrv-smoke
server:
  command: yarn start
  url: http://localhost:3000
  timeoutMs: 180000
defaults:
  timeoutMs: 60000
  # Wallet and RPC connectors log network errors in sandboxes without internet; crashes are caught below.
  failOnConsoleError: false
routes:
  - name: home
    path: /
  - name: guide
    path: /guide
  - name: methodology
    path: /methodology
  - name: verify
    path: /verify
  - name: plants
    path: /plants
  - name: plant
    path: /plants/HYDRO-DEMO-01
  - name: market
    path: /market
  - name: portfolio
    path: /portfolio
  - name: audit
    path: /audit
  - name: blog
    path: /blog
  - name: documents
    path: /documents
  - name: work
    path: /work
  - name: water
    path: /water
  - name: certificate
    path: /certificate/0
  - name: debug
    path: /debug
forbidden:
  visibleText:
    - Application error
    - Unhandled Runtime Error
    - Internal Server Error
