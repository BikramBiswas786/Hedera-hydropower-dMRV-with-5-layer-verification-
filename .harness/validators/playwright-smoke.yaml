name: hydro-dmrv-smoke
server:
  # The Harness validator builds the app before this gate; serve that production output so route
  # checks do not trigger repeated dev compiles or memory-threshold restarts.
  command: yarn next:serve
  url: http://localhost:3000
  timeoutMs: 300000
defaults:
  # The first Next.js compile can exceed one minute on a clean developer machine; keep this
  # below the server startup budget so the smoke gate reports app failures instead of timing out.
  timeoutMs: 180000
  # Wallet and RPC connectors log network errors in sandboxes without internet; crashes are caught below.
  failOnConsoleError: false
routes:
  - name: home
    path: /
  - name: guide
    path: /guide
  - name: methodology
    path: /methodology
  - name: verify
    path: /verify
  - name: plants
    path: /plants
  - name: plant
    path: /plants/HYDRO-DEMO-01
  - name: market
    path: /market
  - name: portfolio
    path: /portfolio
  - name: audit
    path: /audit
  - name: certificate
    path: /certificate/0
  - name: debug
    path: /debug
forbidden:
  visibleText:
    - Application error
    - Unhandled Runtime Error
    - Internal Server Error
