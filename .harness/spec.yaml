schemaVersion: 2

name: hydro-dmrv
description: >-
  Scaffold-HBAR template for carbon-credit dMRV of grid-connected hydropower under Verra VMR0017 v1.0
  with ACM0002 v22.0 (VT0011 grid factor, VT0008 additionality), or CDM AMS-I.D / ACM0002 with TOOL07.
  TOOL03 prices fossil fuel. A 5-stage engine verifies monitoring data and quantifies ER = BE - PE - LE;
  readings and reports are anchored on HCS; the DmrvRegistry contract recomputes the emission
  reductions from the registered design (via HydroVmr0017Module) and mints HTS credits (1 token = 1 t CO2e); a Chainlink HBAR/USD
  feed with a Supra fallback settles USD-priced sales in HBAR; every purchase swaps through SaucerSwap and
  reverts if the pair is more than 3% from that price. Retirements mint HTS NFT certificates. MCP tools and REST endpoints
  expose it to agents. Demo meter keys are for testing only; mainnet deploys refuse them.

agent: claude

baseline:
  commands:
    - name: install
      command: yarn install
    - name: build
      command: yarn next:build
      timeoutMs: 600000

validators:
  static: .harness/validators/static.json
  commands: .harness/validators/yarn.json
  playwright: .harness/validators/playwright-smoke.yaml

contract: .harness/acceptance-contract.json
validator:
  enabled: true

forbiddenFiles:
  - .env
  - packages/nextjs/.env
  - packages/nextjs/.env.local
  - packages/hardhat/.env

# Tier 3.5: deploys to testnet with an ephemeral funded signer. Export HEDERA_OPERATOR_ID / HEDERA_OPERATOR_KEY
# (ECDSA) in your shell to enable; nothing is written into the workspace.
chainValidation:
  enabled: false
  network: testnet
  operator:
    accountIdEnv: HEDERA_OPERATOR_ID
    privateKeyEnv: HEDERA_OPERATOR_KEY
  fundingHbar: 70
  sweepBack: true
  expose:
    browserLocalStorageKey: burnerWallet.pk
    envVars: [__RUNTIME_DEPLOYER_PRIVATE_KEY]
  deploy:
    commands:
      - name: deploy-testnet
        command: yarn workspace @sh/hardhat hardhat deploy --network hederaTestnet
