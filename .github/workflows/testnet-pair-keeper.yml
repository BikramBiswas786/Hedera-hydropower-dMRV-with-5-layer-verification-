name: Testnet pair keeper

# Holds the seeded testnet SaucerSwap pair at the oracle price, so the live market can settle
# (packages/nextjs/scripts/rebalanceTestnetPair.ts). Without the TESTNET_REBALANCER_KEY secret it only reads and
# reports; with it, it makes the one swap that brings the pair back when it has drifted past 1%, then reopens a listing
# from that account's registry custody when less than 0.1 t is for sale (scripts/keepListingOpen.ts), so /market
# always has something to buy. TESTNET_LISTING_KEY overrides the account that lists.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      deepen_hbar:
        description: "Also add this many HBAR (and the matching USD token) of liquidity to the pair"
        required: false
        default: ""
  pull_request:
    paths:
      - packages/nextjs/scripts/rebalanceTestnetPair.ts
      - packages/nextjs/services/mrv/saucerswap.ts
      - packages/nextjs/scripts/keepListingOpen.ts
      - .github/workflows/testnet-pair-keeper.yml

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: yarn

      - run: yarn install --immutable

      - name: Keep the pair at the oracle price
        env:
          REBALANCER_PRIVATE_KEY: ${{ secrets.TESTNET_REBALANCER_KEY }}
          DEEPEN_HBAR: ${{ inputs.deepen_hbar }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$REBALANCER_PRIVATE_KEY" ]; then
            yarn workspace @sh/nextjs pair:rebalance --execute ${DEEPEN_HBAR:+--deepen $DEEPEN_HBAR}
          else
            echo "::notice::Reading only (no TESTNET_REBALANCER_KEY, or a pull request)"
            yarn workspace @sh/nextjs pair:rebalance
          fi

      - name: Keep a listing open
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.TESTNET_LISTING_KEY || secrets.TESTNET_REBALANCER_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$KEEPER_PRIVATE_KEY" ]; then
            yarn workspace @sh/nextjs market:keep-listing --execute
          else
            yarn workspace @sh/nextjs market:keep-listing
          fi
