name: Testnet pair read

# Reads the seeded testnet pair and reports the drift. It does not swap and it does not relist.
# The public testnet USDC pair prices HBAR near $2, so this repo seeded a pair for the recorded sale.
# A keeper that trades the pair back to the oracle is not part of the template. When the pair is more
# than 3% from the oracle, the sale reverts. Mainnet uses the public WHBAR/USDC pair, which needs no keeper.
on:
  # GitHub runs schedules best-effort. Once an hour is enough for a read-only drift report.
  schedule:
    - cron: "31 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - packages/nextjs/scripts/rebalanceTestnetPair.ts
      - packages/nextjs/services/mrv/saucerswap.ts
      - packages/nextjs/scripts/keepListingOpen.ts
      - .github/workflows/testnet-pair-keeper.yml

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: yarn

      - run: yarn install --immutable

      - name: Read the pair against the oracle
        # testnet.hashio.io often times out on eth_call decimals(). That is the public RPC, not the pair.
        # A scheduled miss must not mail a failure. A pull request or a manual run still fails.
        run: |
          set +e
          attempt=1
          while [ "$attempt" -le 2 ]; do
            yarn workspace @sh/nextjs pair:rebalance
            code=$?
            if [ "$code" -eq 0 ]; then
              break
            fi
            echo "pair read attempt ${attempt} exited ${code}"
            attempt=$((attempt + 1))
            sleep 15
          done
          if [ "$code" -ne 0 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::warning::Hashio timed out. The pair was not read this hour."
            exit 0
          fi
          exit "$code"

      - name: Read whether a listing is open
        run: |
          set +e
          yarn workspace @sh/nextjs market:keep-listing
          code=$?
          if [ "$code" -ne 0 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::warning::Listing read failed. Not a template outage."
            exit 0
          fi
          exit "$code"
