name: Testnet pair read

# Reads the seeded testnet pair and reports the drift. It does not swap and it does not relist.
# The public testnet USDC pair prices HBAR near $2, so this repo seeded a pair for the recorded sale.
# A keeper that trades the pair back to the oracle is not part of the template. When the pair is more
# than 3% from the oracle, the sale reverts. Mainnet uses the public WHBAR/USDC pair, which needs no keeper.
on:
  # GitHub runs schedules best-effort. Once an hour is enough for a read-only drift report.
  schedule:
    - cron: "31 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - packages/nextjs/scripts/rebalanceTestnetPair.ts
      - packages/nextjs/services/mrv/saucerswap.ts
      - packages/nextjs/scripts/keepListingOpen.ts
      - .github/workflows/testnet-pair-keeper.yml

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: yarn

      - run: yarn install --immutable

      - name: Read the pair and whether a listing is open
        # testnet.hashio.io often times out on eth_call. thirdweb is the other keyless testnet relay.
        # HEDERA_RPC_URL is what rebalanceTestnetPair.ts and keepListingOpen.ts already read.
        run: |
          set +e
          probe() {
            curl -sf --max-time 20 -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$1" \
              | grep -Eq '"result"[[:space:]]*:[[:space:]]*"0x128"'
          }
          code=1
          for url in https://testnet.hashio.io/api https://296.rpc.thirdweb.com; do
            ready=1
            for try in 1 2 3; do
              if probe "$url"; then
                ready=0
                break
              fi
              echo "$url did not return chain id 296 (try ${try})"
              sleep 10
            done
            if [ "$ready" -ne 0 ]; then
              continue
            fi
            echo "Read via ${url}"
            HEDERA_RPC_URL="$url" yarn workspace @sh/nextjs pair:rebalance
            pair=$?
            HEDERA_RPC_URL="$url" yarn workspace @sh/nextjs market:keep-listing
            listing=$?
            if [ "$pair" -eq 0 ] && [ "$listing" -eq 0 ]; then
              exit 0
            fi
            echo "read via ${url} pair=${pair} listing=${listing}"
            code=$pair
            if [ "$pair" -eq 0 ]; then code=$listing; fi
          done
          echo "::error::No Hedera testnet relay completed the pair read (last exit ${code})."
          exit "$code"
