name: Testnet pair read

# Reads the seeded testnet pair and reports the drift. It does not swap and it does not relist.
# The public testnet USDC pair prices HBAR near $2, so this repo seeded a pair for the recorded sale.
# A keeper that trades the pair back to the oracle is not part of the template. When the pair is more
# than 3% from the oracle, the sale reverts. Mainnet uses the public WHBAR/USDC pair, which needs no keeper.
on:
  # GitHub runs schedules best-effort and dropped most hourly runs on 28 Sep; three slots an hour make a run likely.
  schedule:
    - cron: "11,31,51 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - packages/nextjs/scripts/rebalanceTestnetPair.ts
      - packages/nextjs/services/mrv/saucerswap.ts
      - packages/nextjs/scripts/keepListingOpen.ts
      - .github/workflows/testnet-pair-keeper.yml

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: yarn

      - run: yarn install --immutable

      - name: Read the pair against the oracle
        run: yarn workspace @sh/nextjs pair:rebalance

      - name: Read whether a listing is open
        run: yarn workspace @sh/nextjs market:keep-listing
