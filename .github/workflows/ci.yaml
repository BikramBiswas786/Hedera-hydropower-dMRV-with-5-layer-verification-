name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: yarn

      - run: yarn install --immutable
      - run: yarn lint --max-warnings=0
      - run: yarn next:check-types
      - run: yarn hardhat:check-types
      - run: yarn hardhat:test
      # Fails if any deployable contract's runtime bytecode exceeds 24,064 B (EIP-170 minus a 512 B margin).
      - run: yarn hardhat:size
      - run: yarn next:test
      - run: yarn next:build

  # Proves the eligibility gate: the template scaffolds through the real CLI and the result installs, lints and builds.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: template

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3

      - name: Configure git for the CLI's initial commit
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          corepack enable

      # The judged command, `npm create scaffold-hbar@latest --template BikramBiswas786/Hedera-hydropower-dMRV-with-5-layer-verification-`,
      # made non-interactive (project name + --ci flags), as in the README Quick start. CREATE_SCAFFOLD_HBAR_TEMPLATE_DIR
      # points it at this checkout, so the branch or pull request under test is what gets scaffolded.
      - name: Scaffold with the judged command
        env:
          CREATE_SCAFFOLD_HBAR_TEMPLATE_DIR: ${{ github.workspace }}/template
        run: |
          npm create scaffold-hbar@latest -- hydro-dmrv \
            --template BikramBiswas786/Hedera-hydropower-dMRV-with-5-layer-verification- \
            --ci --package-manager yarn --solidity-framework hardhat --skip-hedera-skills

      - name: Test the scaffolded project from the lockfile
        working-directory: hydro-dmrv
        run: |
          yarn install --immutable
          yarn lint --max-warnings=0
          yarn test
          yarn hardhat:size
          yarn next:build

      - name: No template manifest or secrets left behind
        working-directory: hydro-dmrv
        run: |
          test ! -f template.json
          test ! -f .env && test ! -f packages/nextjs/.env.local && test ! -f packages/hardhat/.env

  # Runs the submitted Hedera Harness recipe (.harness/) the way a judge would: install, lint, tests, build, the
  # static validators and the Playwright route smoke. Keeps the validators from drifting away from the code.
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: yarn

      - run: yarn install --immutable
      - run: npx playwright install --with-deps chromium
      - run: yarn harness:validate
