name: Live smoke

# Clicks through https://hydro-dmrv.vercel.app with no wallet (packages/nextjs/scripts/liveSmoke.ts): registry and
# market addresses, the SaucerSwap pair against the oracle, an open listing, an unsigned purchase, every issuance
# re-derived from HCS, the verify scenarios and the MCP tool list. The table lands in the job summary.
# It runs after Vercel reports a successful production deployment rather than on push, so it checks the code that
# was just deployed (a push-triggered run could beat the deploy and test the previous build). Pull requests are not
# checked here: the script tests production, which a PR has not changed yet.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  deployment_status:

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: yarn

      - run: yarn install --immutable

      # GitHub runs scheduled workflows best-effort and skipped hours of the hourly pair keeper on 28 Sep while HBAR
      # moved 24%, so the market (correctly) refused every sale. Do the keeper's work first; the checks below still
      # fail if the pair cannot be brought back within 3% or no listing can be opened.
      - name: Keep the testnet pair at the oracle and a listing open
        env:
          REBALANCER_PRIVATE_KEY: ${{ secrets.TESTNET_REBALANCER_KEY }}
          KEEPER_PRIVATE_KEY: ${{ secrets.TESTNET_LISTING_KEY || secrets.TESTNET_REBALANCER_KEY }}
        run: |
          if [ -n "$REBALANCER_PRIVATE_KEY" ]; then
            yarn workspace @sh/nextjs pair:rebalance --execute
            yarn workspace @sh/nextjs market:keep-listing --execute
          else
            echo "::notice::No TESTNET_REBALANCER_KEY; checking without maintenance"
          fi

      - name: Check the live deployment
        run: yarn live:smoke
