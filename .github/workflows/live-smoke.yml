name: Live smoke

# Clicks through https://hydro-dmrv.vercel.app with no wallet (packages/nextjs/scripts/liveSmoke.ts): registry and
# market addresses, the SaucerSwap pair against the oracle, an open listing, an unsigned purchase, every issuance
# re-derived from HCS, the verify scenarios and the MCP tool list. The table lands in the job summary.
# It runs after Vercel reports a successful production deployment rather than on push, so it checks the code that
# was just deployed (a push-triggered run could beat the deploy and test the previous build). Pull requests are not
# checked here: the script tests production, which a PR has not changed yet.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  deployment_status:

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: yarn

      - run: yarn install --immutable

      - name: Check the live deployment
        run: yarn live:smoke
