name: Sourcify verify (testnet)

# Verifies the live testnet contracts on Sourcify so HashScan shows their source. Each job compiles the commit the
# contracts were deployed from; Sourcify reads the constructor arguments from the creation transaction.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: 06a6278c
            targets: DmrvRegistry@0xaf9C76B48B317cee770ED6AE038D516b269E0129 HydroVmr0017Module@0x8D57432792aD39Ef2d2e104904e31b157846261d ResilientHbarUsdFeed@0x9529A0189654834949cf78f9ce25336be59F8AbB
          - ref: 61aba8a4
            targets: CreditMarket@0x5aeDe76fc6625cfA3227FFf70197D4D7ff3e5030
          - ref: fc43362a
            targets: UsdCheckout@0x455eFbF07B2b5d5137AEc3601c43549593741898
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: src
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
      - name: Compile the deployed commit
        working-directory: src
        run: |
          corepack enable
          yarn install --immutable
          yarn workspace @sh/hardhat hardhat compile
      - name: Submit to Sourcify
        run: node tool/.github/scripts/sourcify-verify.mjs src/packages/hardhat 296 ${{ matrix.targets }}
